services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment: &laravel-environment
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: downloadportal
      DB_USERNAME: downloadportal
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-password}
      SEMANTIC_SEARCH_URL: http://semantic-search:8080
      BIBLE_API_URL: http://bible-api:8080
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: ["sh", "-c", "php artisan storage:link --force --no-interaction && php-fpm"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - application

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - application

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: downloadportal
      MYSQL_USER: downloadportal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udownloadportal", "-p${MYSQL_PASSWORD:-local-password}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - application

  semantic-search:
    build:
      context: ./semantic-search
    environment:
      SEMANTIC_SEARCH_TOKEN: ${SEMANTIC_SEARCH_TOKEN:?Set SEMANTIC_SEARCH_TOKEN in .env}
    volumes:
      - semantic-models:/models
    expose:
      - "8080"
    networks:
      - application

  bible-api:
    build:
      context: ${BIBLE_API_CONTEXT:-../../projects/bibleapi}
    volumes:
      - ${BIBLE_API_CONTEXT:-../../projects/bibleapi}/db:/app/db
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - application
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment: *laravel-environment
    command: php artisan migrate --force --no-interaction
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - application
    restart: "no"

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment: *laravel-environment
    command: php artisan queue:work database --tries=3 --timeout=60
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
      semantic-search:
        condition: service_started
      bible-api:
        condition: service_healthy
    networks:
      - application

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment: *laravel-environment
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - application

volumes:
  mysql:
  semantic-models:
  vendor:

networks:
  application:
    driver: bridge
