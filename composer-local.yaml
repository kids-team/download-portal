# Local development environment for the Downloadportal.
# Requires docker/php/Dockerfile, docker/nginx/default.conf and semantic-search/Dockerfile.

x-laravel-env: &laravel-env
  APP_URL: http://localhost:${APP_PORT:-8080}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: downloadportal
  DB_USERNAME: downloadportal
  DB_PASSWORD: ${MYSQL_PASSWORD:-local-password}
  SEMANTIC_SEARCH_URL: http://semantic-search:8080

x-php-base: &php-base
  image: downloadportal-php:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file:
    - .env
  environment: *laravel-env
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  networks:
    - application

services:
  php:
    <<: *php-base
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - application
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: downloadportal
      MYSQL_USER: downloadportal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - application
    restart: unless-stopped

  semantic-search:
    build:
      context: ./semantic-search
    environment:
      SEMANTIC_SEARCH_TOKEN: ${SEMANTIC_SEARCH_TOKEN:?Set SEMANTIC_SEARCH_TOKEN in .env}
    volumes:
      - semantic-models:/models
    expose:
      - "8080"
    networks:
      - application
    restart: unless-stopped

  migrate:
    <<: *php-base
    command: php artisan migrate --force --no-interaction
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  queue:
    <<: *php-base
    command: php artisan queue:work database --tries=3 --timeout=60
    depends_on:
      migrate:
        condition: service_completed_successfully
      semantic-search:
        condition: service_started
    restart: unless-stopped

  scheduler:
    <<: *php-base
    command: php artisan schedule:work
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql:
  semantic-models:
  vendor:

networks:
  application:
    driver: bridge

